services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    environment:
      KC_HOSTNAME: 18.135.49.118
      KC_HOSTNAME_PORT: 80
      KC_HOSTNAME_STRICT_BACKCHANNEL: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health/ready"]
      interval: 15s
      timeout: 2s
      retries: 15
    command: ["start-dev", "--http-port", "80"]
    ports:
      - "80:80"
    networks:
      - kc_poc

  saml-app:
    build:
      context: .
    env_file:
      - .env.prod
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    restart: always
    networks:
      - kc_poc

networks:
  kc_poc:
    driver: bridge